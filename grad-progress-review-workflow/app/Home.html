<!DOCTYPE html>
<html lang="en">
<head><base target="_top"><meta charset="utf-8"><?!= include_('Styles') ?></head>
<body class="theme-cf">
<header class="top">
  <div class="eyebrow" id="eyebrow">UW Anthropology · Graduate Student Course Feedback</div>
  <h1 id="title">Your Graduate Student Course Feedback</h1>
  <p id="sub"></p>
</header>
<main id="main"><p>Loading…</p></main>
<?!= include_('Common') ?>
<script>
  var DATA = <?!= dataJson ?>;
  var main = document.getElementById('main');
  function fail(e) { main.innerHTML = '<div class="warnbox">' + esc(e.message) + '</div>'; }

  if (DATA.view === 'student') {
    document.body.className = 'theme-cf';
    document.title = 'Grad Student Course Feedback (Student View) · UW Anthropology';
    call('myCourseFeedback').then(function (d) {
      document.getElementById('sub').textContent = 'Read-only coursework notes from your instructors, released after the GPC reads them.';
      var h = '<div class="scope-box" role="region" aria-label="Page purpose"><div class="scope-box-title">Graduate Student Course Feedback · Student View (Read-Only)</div>' +
        '<div class="scope-grid"><div class="scope-col"><h3>What this page shows</h3><p>Released coursework notes from your class instructors. Each note names one thing you did well and one suggestion for what to work on next.</p></div>' +
        '<div class="scope-col not-this"><h3>Separate systems</h3><p>These notes are separate from course grades, separate from TA/ASE evaluations, and separate from your annual progress review form.</p></div></div></div>';
      if (d.records.length) h += d.records.map(function (r) { return '<h2>Course Feedback Record ' + esc(r.year) + '</h2>' + recordHtml(r.record); }).join('');
      h += d.quarters.length ? d.quarters.map(function (q) { return '<h2>' + esc(q.quarter) + '</h2>' + recordHtml(q.record); }).join('') : '<p class="muted">No course feedback has been released to you yet.</p>';
      main.innerHTML = h;
    }).catch(fail);
  } else if (DATA.view === 'advisor') {
    document.body.className = 'theme-cf';
    document.title = "Grad Student Course Feedback (Advisees' View) · UW Anthropology";
    document.getElementById('eyebrow').textContent = 'UW Anthropology · Graduate Student Course Feedback';
    document.getElementById('title').textContent = "Your Advisees' Graduate Student Course Feedback";
    document.getElementById('sub').textContent = 'Read-only coursework notes from class instructors · Your role: Faculty Advisor';
    call('adviseesCourseFeedback').then(function (list) {
      var intro = '<div class="scope-box" role="region" aria-label="Page purpose"><div class="scope-box-title">Graduate Student Course Feedback · Advisor View (Read-Only)</div>' +
        '<div class="scope-grid"><div class="scope-col"><h3>What this page shows</h3><p>Released coursework notes written by your advisees\' class instructors. No form needs to be filled out on this page.</p></div>' +
        '<div class="scope-col not-this"><h3>Separate systems (not an action form)</h3><p>This is separate from TA/ASE employment evaluations (purple system) and separate from your spring Graduate Student Annual Review advisor evaluation (deep navy system).</p></div></div></div>';
      main.innerHTML = intro + (list.length ? list.map(function (a) {
        return '<h2>' + esc(a.name) + '</h2>' + a.quarters.map(function (q) { return '<h3>' + esc(q.quarter) + '</h3>' + recordHtml(q.record); }).join('');
      }).join('') : '<p class="muted">No course feedback has been released for your advisees yet.</p>');
    }).catch(fail);
  } else {
    document.body.className = 'theme-annual';
    document.title = 'Grad Student Annual Review: Subfield Summary · UW Anthropology';
    document.getElementById('eyebrow').textContent = 'UW Anthropology · Graduate Student Annual Review (Policy 3.7)';
    document.getElementById('title').textContent = 'Subfield Calibration Summary';
    document.getElementById('sub').textContent = 'For preparing the annual review calibration meeting: coverage, ratings grid and follow-ups only.';
    call('coordinatorSummary').then(function (list) {
      main.innerHTML = '<div class="note">Course feedback levels are relative to each student\'s stage, are not averaged, and are never compared across instructors or students.</div>' +
        (list.length ? list.map(function (s) {
          return '<div class="card"><h2 style="margin-top:0">' + esc(s.name) + '</h2><p class="muted">' + esc(s.subfield) + (s.year ? ' · year ' + esc(s.year) : '') +
            (s.recommendedRating ? ' · advisor recommends: ' + esc(s.recommendedRating) : '') + '</p>' + recordHtml(s.record) + '</div>';
        }).join('') : '<p class="muted">No students in your subfield yet.</p>');
    }).catch(fail);
  }
</script>
</body>
</html>
