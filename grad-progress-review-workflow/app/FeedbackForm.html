<!DOCTYPE html>
<html lang="en">
<head><base target="_top"><meta charset="utf-8"><?!= include_('Styles') ?></head>
<body class="theme-cf">
<header class="top">
  <div class="eyebrow">UW Anthropology · Graduate Student Course Feedback</div>
  <h1 id="title">Graduate Student Course Feedback</h1>
  <p id="sub"></p>
</header>
<main id="main"><p>Loading…</p></main>
<?!= include_('Common') ?>
<script>
  var DATA = <?!= dataJson ?>;
  var page = null;

  function scopeBox() {
    return '<div class="scope-box" role="region" aria-label="Form purpose and scope">' +
      '<div class="scope-box-title">Graduate Student Course Feedback · Course Instructor Form</div>' +
      '<div class="scope-grid">' +
      '<div class="scope-col"><h3>What you are doing here</h3><ul>' +
      '<li>Writing brief academic coursework notes on Anthropology graduate students <strong>enrolled in ' + esc(page.offering) + ' (' + esc(page.quarter) + ') for credit</strong>.</li>' +
      '<li>Describe the coursework, rather than the person: what they did well and what to work on next.</li>' +
      '<li>Each student reads these notes with your name on them. They become part of the student\'s FERPA education record.</li>' +
      '</ul></div>' +
      '<div class="scope-col not-this"><h3>Separate systems (not this form)</h3><ul>' +
      '<li><strong>Not a TA / ASE Employment Evaluation:</strong> Do not evaluate paid TA or RA teaching duties here. TA evaluations arrive in a separate purple email and form.</li>' +
      '<li><strong>Not a Graduate Student Annual Review:</strong> Faculty advisors evaluate overall degree progress separately (deep navy form).</li>' +
      '<li><strong>No grades or personal details:</strong> Do not include course grades, health, or personal circumstances. If those matter, tick "follow up" and talk to the GPC.</li>' +
      '</ul></div></div>' +
      '<p class="scope-foot">Did not teach ' + esc(page.offering) + ', or listed only as a TA supervisor? <a href="#" id="notMineLink">Report wrong course</a>.</p>' +
      '</div>';
  }

  function studentBlock(s, i) {
    var dis = s.editable && !page.readOnlyLock && !page.viewOnly ? '' : ' disabled';
    var id = 's' + i;
    var levels = function (key, label) {
      return '<label for="' + id + key + '">' + esc(label) + ' <span class="help">Relative to the student\'s stage in their graduate program</span></label><select id="' + id + key + '" data-f="' + key + '"' + dis + '><option value="">Choose…</option>' +
        page.levels.map(function (l) { return '<option' + (l === s[key] ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select>';
    };
    var radio = function (val, label) {
      return '<label class="radio"><input type="radio" name="' + id + 'c" value="' + val + '" data-f="contact"' + (s.contact === val ? ' checked' : '') + dis + '> ' + label + '</label>';
    };
    return '<section class="card" data-student="' + esc(s.email) + '"><h2 style="margin-top:0">' + esc(s.name) + '</h2>' +
      '<p style="margin:4px 0 6px"><span class="role-pill">Enrolled grad student in ' + esc(s.course) + '</span>' +
      (s.isAdvisee ? '<span class="pill">Your advisee</span>' : '') + '</p>' +
      '<p class="muted">' + esc(s.program) + (s.subfield ? ' · ' + esc(s.subfield) : '') + (s.year ? ' · year ' + esc(s.year) + ' in the program' : '') + (s.candidacy ? ' · ' + esc(s.candidacy) : '') + ' · ' + esc(s.course) + '</p>' +
      (s.returnedReason ? '<div class="warnbox"><strong>The GPC asked you to look again at this course feedback comment:</strong> ' + nl2br(s.returnedReason) + '</div>' : '') +
      '<fieldset><legend>Did you have enough contact with their coursework to comment?</legend>' + radio('enough', 'Enough contact to comment') +
      radio('not_enough', 'Not enough contact (e.g. in a big class)') + (s.isAdvisee ? radio('covered', 'Covered in my annual review (you are this student\'s advisor)') : '') + '</fieldset>' +
      '<div data-details style="' + (s.contact === 'enough' ? '' : 'display:none') + '">' +
      '<div class="grid2"><div>' + levels('written', 'Written work submitted by the student') + '</div><div>' + levels('discussion', 'Student\'s contribution to class discussion and quality of their presentations, if any') + '</div></div>' +
      levels('literature', 'Command of literature, theory or methods relevant to the course') +
      '<label for="' + id + 'st">One thing this student did well in this course, with an example</label><textarea id="' + id + 'st" maxlength="500" data-f="strength"' + dis + '>' + esc(s.strength) + '</textarea><div class="counter"></div>' +
      '<label for="' + id + 'ns">The one thing that would most strengthen their work next, and how they could do it</label><textarea id="' + id + 'ns" maxlength="500" data-f="nextStep"' + dis + '>' + esc(s.nextStep) + '</textarea><div class="counter"></div>' +
      '<label class="radio"><input type="checkbox" data-f="followup"' + (s.followup ? ' checked' : '') + dis + '> I\'d like the GPC to follow up with this student this quarter</label>' +
      '<div data-fu style="' + (s.followup ? '' : 'display:none') + '"><label for="' + id + 'fu">What did you observe, and when? <span class="help">For example, missed submissions, or a pattern across the written work.</span></label>' +
      '<textarea id="' + id + 'fu" maxlength="1000" data-f="followupNote"' + dis + '>' + esc(s.followupNote) + '</textarea></div>' +
      '</div></section>';
  }

  function render() {
    document.title = 'Grad Student Course Feedback: ' + page.offering + ' · UW Anthropology';
    document.getElementById('title').textContent = 'Graduate Student Course Feedback: ' + page.offering;
    document.getElementById('sub').textContent = page.quarter + ' · Your role: Course Instructor' + (page.due ? ' · Due ' + page.due : '');
    var h = '';
    if (page.viewOnly) h += '<div class="warnbox">You are viewing this page as the administrator. Only the instructors can change or submit it.</div>';
    if (page.readOnlyLock) h += '<div class="warnbox">' + esc(page.lockOwner) + ' is editing this shared page. It will open for you when they finish (within 30 minutes).</div>';
    if (page.closed) h += '<div class="warnbox">This page has closed. You can still revise any comment the GPC returned to you.</div>';
    h += scopeBox() + '<p class="muted">About 30 seconds for a student you could not comment on, and 3 to 4 minutes for one you could.</p>';
    h += page.students.map(studentBlock).join('');
    h += '<section class="card"><label for="sig">Type your name to sign this Graduate Student Course Feedback for ' + esc(page.offering) + '</label><input type="text" id="sig" value="' + esc(page.signature) + '">' +
      '<label for="mins">How long did this take? <span class="help">Optional, for the pilot</span></label><select id="mins"><option value="">Choose…</option>' +
      ['under 5', '5 to 15', 'over 15'].map(function (m) { return '<option' + (m === page.minutes ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></section>';
    h += '<div class="status"><button id="save">Save draft</button><button id="submit" class="primary">Submit Course Feedback</button><div id="msg" role="status" aria-live="polite"></div></div>' +
      '<p class="muted">Save draft keeps comments you have not submitted yet. To change a comment you have already submitted, edit it and press Submit Course Feedback again.</p>';
    document.getElementById('main').innerHTML = h;
    var main = document.getElementById('main');
    var nmLink = document.getElementById('notMineLink');
    if (nmLink) nmLink.onclick = function (e) { e.preventDefault(); notMine(); };
    main.addEventListener('change', function (e) {
      var card = e.target.closest('[data-student]');
      if (!card) return;
      if (e.target.getAttribute('data-f') === 'contact') card.querySelector('[data-details]').style.display = e.target.value === 'enough' ? '' : 'none';
      if (e.target.getAttribute('data-f') === 'followup') card.querySelector('[data-fu]').style.display = e.target.checked ? '' : 'none';
    });
    main.querySelectorAll('textarea[maxlength]').forEach(function (t) {
      var c = t.nextElementSibling && t.nextElementSibling.classList.contains('counter') ? t.nextElementSibling : null;
      var upd = function () { if (c) c.textContent = t.value.length + ' / ' + t.getAttribute('maxlength'); };
      t.addEventListener('input', upd); upd();
    });
    document.getElementById('save').onclick = function () { send(false); };
    document.getElementById('submit').onclick = function () { send(true); };
    if (page.readOnlyLock || page.viewOnly) { document.getElementById('save').disabled = true; document.getElementById('submit').disabled = true; }
    if (page.viewOnly) document.getElementById('sig').disabled = true;
  }

  function gather() {
    var students = {};
    document.querySelectorAll('[data-student]').forEach(function (card) {
      var o = {};
      card.querySelectorAll('[data-f]').forEach(function (el) {
        var k = el.getAttribute('data-f');
        if (el.type === 'radio') { if (el.checked) o[k] = el.value; }
        else if (el.type === 'checkbox') o[k] = el.checked;
        else o[k] = el.value;
      });
      students[card.getAttribute('data-student')] = o;
    });
    return { students: students, signature: document.getElementById('sig').value, minutes: document.getElementById('mins').value };
  }

  function send(final) {
    say(final ? 'Submitting…' : 'Saving…');
    call('saveFeedbackPage', DATA.token, gather(), final).then(function (res) {
      var skippedNote = res && res.skipped ? ' Changes to comments you had already submitted were not saved; press Submit Course Feedback to send them.' : '';
      say(final ? 'Thank you. Your Graduate Student Course Feedback for ' + page.offering + ' (' + page.quarter + ') is submitted. You can edit it until the page closes.' : 'Draft saved.' + skippedNote, 'ok');
    }).catch(function (e) { say(e.message, 'bad'); });
  }

  function notMine() {
    var courseLabel = page && page.offering ? page.offering : 'this course';
    document.title = 'Grad Student Course Feedback: Not Your Course? · UW Anthropology';
    document.getElementById('title').textContent = 'Graduate Student Course Feedback: Not Your Course?';
    document.getElementById('sub').textContent = page && page.quarter ? page.offering + ' · ' + page.quarter : 'Report an incorrect instructor assignment';
    document.getElementById('main').innerHTML = '<div class="card"><p>Thank you for telling us that you did not teach ' + esc(courseLabel) + ' for Graduate Student Course Feedback. If you know who taught it, add their name and we will send the course feedback page to them.</p>' +
      '<label for="who">Who taught it? <span class="help">Optional</span></label><input type="text" id="who">' +
      '<button class="primary" id="send">Report Wrong Course</button><div id="msg" role="status" aria-live="polite"></div></div>';
    document.getElementById('send').onclick = function () {
      call('notMyCourse', DATA.token, document.getElementById('who').value).then(function () {
        document.getElementById('main').innerHTML = '<div class="card"><p>Thank you. We have closed this Graduate Student Course Feedback page and will send it to the right instructor. There is nothing more you need to do.</p></div>';
      }).catch(function (e) { say(e.message, 'bad'); });
    };
  }

  if (DATA.notMine) notMine();
  else call('loadFeedbackPage', DATA.token).then(function (p) {
    if (p.error) { document.getElementById('main').innerHTML = '<div class="warnbox">' + esc(p.error) + '</div>'; return; }
    page = p; render();
  }).catch(function (e) { document.getElementById('main').innerHTML = '<div class="warnbox">' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
