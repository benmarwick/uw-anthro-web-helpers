    { key: 'lastGoals', label: "Last year's goals", type: 'rows', columns: [{ key: 'goal', label: 'Goal', type: 'readonly' },

    { key: 'funding', label: 'Funding and TA requests for next year', help: 'Expected funding source; TA or RA interest by quarter.', type: 'textarea' },

    { key: 'actualMeetings', label: 'How many times did you meet your advisor this year?', viewLabel: 'Advisor meetings this year', type: 'number' },
    { key: 'advising', label: 'Advising', help: 'Preferred meeting frequency; any committee changes needed. Your advisor sees this section.', type: 'textarea' },
    { key: 'asks', label: 'What would help you most this year?', viewLabel: 'Support requested for next year', type: 'textarea' },

    { key: 'signatureName', label: 'Type your name to sign', type: 'text', required: true }
  ];
  var STUDENT_MA = [
    { key: 'research', label: 'How did this quarter go, and what comes next?', viewLabel: 'Quarterly reflection and next steps', type: 'textarea', required: true },
    { key: 'careerCheckin', label: 'Career check-in', help: 'Seen by you and your advisor only.', type: 'textarea' },
    { key: 'gpcOnly', label: 'Only for the GPC (optional)', viewLabel: 'Student note (GPC only)', help: 'Your advisor will not see this.', type: 'textarea' },
    { key: 'signatureName', label: 'Type your name to sign', type: 'text', required: true }
  ];
  var ADVISOR_ANNUAL = [
    { key: 'meetingDate', label: 'Date you met the student', viewLabel: 'Date of advisor meeting', help: 'The meeting is expected before you evaluate.', type: 'date', required: true },
    { key: 'milestoneDeterminations', label: 'Milestone determinations', help: 'For each milestone attempted this year. Printed in the letter as your written decision.', type: 'rows',
      columns: [{ key: 'milestone', label: 'Milestone' }, { key: 'result', label: 'Result', type: 'select', options: ['satisfied', 'not yet satisfied', 'not satisfied'] }, { key: 'reason', label: 'One-line reason' }] },
    { key: 'mentorChecklist', label: 'Mentor checklist', type: 'group', fields: [
      { key: 'deadlinesKnown', label: 'The student knows the upcoming milestone deadlines', type: 'select', options: YN },
      { key: 'feasiblePlan', label: 'The student has a feasible plan to meet them', type: 'select', options: YN },
      { key: 'standardDiscussed', label: 'We discussed the standard for the next milestone', type: 'select', options: YN },
      { key: 'roadblocks', label: 'Roadblocks I can remove' }] },
    { key: 'actionItems', label: 'Action items', help: 'Printed in the letter and carried into next year\'s form and any check-in.', type: 'rows',
      columns: [{ key: 'action', label: 'Action' }, { key: 'owner', label: 'Owner', type: 'select', options: ['student', 'advisor', 'committee', 'program'] }, { key: 'due', label: 'Due', type: 'date' }] },
    { key: 'agreement', label: "Do you agree with the student's self-assessment?", viewLabel: "Agreement with student's self-assessment", help: 'If not, say how you advised the student.', type: 'rows',
      columns: [{ key: 'area', label: 'Area', type: 'readonly' }, { key: 'agree', label: 'Agree?', type: 'select', options: ['agree', 'disagree'] }, { key: 'comment', label: 'Comment' }] },
    { key: 'accomplishments', label: 'Notable accomplishments', help: 'Specific work, with an example. Fed into the letter.', type: 'textarea', required: true },
    { key: 'developmentAreas', label: 'Areas for development', type: 'rows', columns: [{ key: 'area', label: 'Area' }, { key: 'seriousness', label: 'Seriousness', type: 'select', options: ['minor', 'moderate', 'serious'] }] },
    { key: 'timelineComments', label: 'Comments on the timeline', help: 'Required if a milestone is overdue.', type: 'textarea' },
    { key: 'goalsAdded', label: 'Goals added or amended for next year', type: 'textarea' },

    { key: 'concerns', label: 'If there are concerns', viewLabel: 'Concerns (benchmark, deadline, support, and consequence)', help: 'Each is required when the rating is below Satisfactory (Policy 3.7.2).', type: 'group', fields: [
      { key: 'benchmark', label: 'The specific benchmark' }, { key: 'deadline', label: 'The deadline' }, { key: 'support', label: 'The support you and the department will give' },
      { key: 'consequence', label: 'The consequence if the benchmark is not met' }] },
    { key: 'checkinMonths', label: 'Check-in in', viewLabel: 'Follow-up check-in interval (months)', help: 'Three months is required if the student is missing a milestone or has a GPA below 3.0.', type: 'select', options: ['3', '6'] },

    { key: 'signatureName', label: 'Type your name to sign', help: 'Co-advisors can add to this draft; one of you signs.', type: 'text', required: true }
  ];
  var ADVISOR_CHECKIN = [
    { key: 'benchmarkProgress', label: 'Progress on each benchmark', type: 'textarea' },
    { key: 'milestoneDeterminations', label: 'Milestone determinations', type: 'rows', columns: [{ key: 'milestone', label: 'Milestone' },
      { key: 'result', label: 'Result', type: 'select', options: ['satisfied', 'not yet satisfied', 'not satisfied'] }, { key: 'reason', label: 'Reason' }] },
    { key: 'actionItems', label: 'Action items', type: 'rows', columns: [{ key: 'action', label: 'Action' }, { key: 'owner', label: 'Owner', type: 'select', options: ['student', 'advisor', 'committee', 'program'] }, { key: 'due', label: 'Due', type: 'date' }] },
    { key: 'verdict', label: 'Your verdict', viewLabel: 'Advisor verdict', type: 'select', options: ['resolved', 'continuing', 'escalate'], required: true, help: '"escalate" sends the check-in to the GPC.' },
    { key: 'signatureName', label: 'Type your name to sign', type: 'text', required: true }
  ];
  var EXTRA_LABELS = {
    compactCheck: 'Advisor-advisee compact check',
    planToCompletion: 'Plan to completion',
    skillsAssessment: 'Skills self-assessment',
    careerSkillsComment: 'Comment on the career check-in'
  };
  var ACK = [
    { key: 'acknowledged', label: 'I have read my advisor\'s evaluation and the letter. (Acknowledging does not mean agreeing.)', type: 'check', required: true },
    { key: 'responseText', label: 'Your written response (optional)', help: 'It will be attached to your review.', type: 'textarea' },

    { key: 'signatureName', label: 'Type your name to sign', type: 'text', required: true }

  function section(title, body) { return '<h2>' + esc(title) + '</h2>' + body; }

  function reviewMeta() {
    var cycle = R.cycleLabel || R.cycle || '';
    var isAnnual = R.type === 'ANNUAL';
    var isMa = !isAnnual && R.program === 'MA';
    var roleLabel = R.stage === 'advisor' ? 'Faculty Advisor' : 'Graduate Student';
    var processName = isAnnual
      ? cycle + ' PhD Annual Review'
      : (isMa ? (cycle ? cycle + ' ' : '') + 'MA Quarterly Check-In' : (cycle ? cycle + ' ' : '') + 'PhD Interim Progress Check-In');
    var eyebrow = isAnnual
      ? 'UW Anthropology · Graduate Student Annual Review (Policy 3.7)'
      : (isMa ? 'UW Anthropology · Graduate Student MA Quarterly Check-In (Policy 3.7)' : 'UW Anthropology · Graduate Student PhD Interim Check-In (Policy 3.7)');
    var stageLabel = {
      student: isAnnual ? 'Student Self-Report' : 'Student Check-In',
      advisor: isAnnual ? 'Advisor Evaluation' : 'Advisor Check-In',
      ack: 'Letter Acknowledgement'
    }[R.stage];
    var submitLabel = {
      student: isAnnual ? 'Submit Annual Review Report' : 'Submit MA Quarterly Check-In',
      advisor: isAnnual ? 'Submit Advisor Annual Review' : (isMa ? 'Submit Advisor MA Check-In' : 'Submit Advisor Interim Check-In'),
      ack: 'Submit Letter Acknowledgement'
    }[R.stage];
    var shortTag = isAnnual ? 'Grad Student Annual Review' : (isMa ? 'Grad Student MA Check-In' : 'Grad Student Interim Check-In');
    return { cycle: cycle, isAnnual: isAnnual, isMa: isMa, roleLabel: roleLabel, processName: processName, eyebrow: eyebrow, stageLabel: stageLabel, submitLabel: submitLabel, shortTag: shortTag };
  }

  function scopeBox(m) {
    var doing = '';
    var separate = '';
    if (R.stage === 'advisor' && m.isAnnual) {
      doing = '<ul><li>Completing the <strong>' + esc(m.processName) + '</strong> for your advisee <strong>' + esc(R.studentName) + '</strong> in your role as <strong>Faculty Advisor</strong> (UW Graduate School Policy 3.7).</li>' +
        '<li>Read ' + esc(R.studentName) + '\'s annual report below, meet with them, and submit your advisor evaluation and recommended rating.</li>' +
        '<li>Shared with the student, the GPC, and the subfield calibration group, and archived in the final Annual Review PDF.</li></ul>';
      separate = '<ul><li><strong>Not a TA / ASE Employment Evaluation:</strong> Do not evaluate paid TA or RA job duties here. TA evaluations use the separate purple TA Evaluation System.</li>' +
        '<li><strong>Not Graduate Student Course Feedback:</strong> Single-class coursework feedback from instructors uses the separate forest-green Course Feedback form.</li></ul>';
    } else if (R.stage === 'advisor' && m.isMa) {
      doing = '<ul><li>Completing the <strong>' + esc(m.processName) + '</strong> for your advisee <strong>' + esc(R.studentName) + '</strong> as their <strong>Faculty Advisor</strong> (UW Graduate School Policy 3.7).</li>' +
        '<li>Review their quarterly note below and record milestone determinations, action items, and your verdict.</li></ul>';
      separate = '<ul><li><strong>Not a TA / ASE Employment Evaluation:</strong> Paid TA/RA duties are evaluated separately in the purple TA Evaluation System.</li>' +
        '<li><strong>Not Graduate Student Course Feedback:</strong> Single-class instructor feedback uses the separate forest-green Course Feedback form.</li></ul>';
    } else if (R.stage === 'advisor') {
      doing = '<ul><li>Completing a <strong>' + esc(m.processName) + '</strong> for your advisee <strong>' + esc(R.studentName) + '</strong> as their <strong>Faculty Advisor</strong>.</li>' +
        '<li>Record progress on agreed benchmarks, milestone determinations, action items, and your verdict.</li></ul>';
      separate = '<ul><li><strong>Not a TA / ASE Employment Evaluation:</strong> Paid TA/RA duties are evaluated separately in the purple TA Evaluation System.</li>' +
        '<li><strong>Not Graduate Student Course Feedback:</strong> Single-class instructor feedback uses the separate forest-green Course Feedback form.</li></ul>';
    } else if (R.stage === 'student') {
      doing = '<ul><li>Completing your <strong>' + esc(m.processName) + '</strong> self-report (UW Graduate School Policy 3.7).</li>' +
        '<li>Your advisor reads your report before you meet. Each box states who reads it, and "Only for the GPC" is never shown to your advisor.</li></ul>';
      separate = '<ul><li><strong>Not a TA / ASE Employment Evaluation:</strong> TA self-evaluations and time sheets are submitted separately in the purple TA Evaluation System.</li>' +
        '<li><strong>Separate from course grades:</strong> This covers overall degree progress and next-year planning.</li></ul>';
    } else {
      doing = '<ul><li>Reviewing your advisor\'s evaluation and official <strong>' + esc(m.processName) + '</strong> letter, and confirming you have read them.</li>' +
        '<li>Confirming does not mean agreeing; you may add a written response or ask to meet with the GPC.</li></ul>';
      separate = '<ul><li><strong>Not a TA / ASE Employment Evaluation:</strong> TA evaluations are signed separately in the purple TA Evaluation System.</li></ul>';
    }
    return '<div class="scope-box" role="region" aria-label="Form purpose and scope">' +
      '<div class="scope-box-title">' + esc(m.processName) + ' · ' + esc(m.stageLabel) + ' · Role: ' + esc(m.roleLabel) + '</div>' +
      '<div class="scope-grid">' +
      '<div class="scope-col"><h3>What you are doing here</h3>' + doing + '</div>' +
      '<div class="scope-col not-this"><h3>Separate systems (not this form)</h3>' + separate + '</div>' +
      '</div></div>';
  }

  function render() {
    var m = reviewMeta();
    document.body.className = m.isAnnual ? 'theme-annual' : 'theme-checkin';
    document.title = m.shortTag + ' (' + m.roleLabel + '): ' + R.studentName + ' · UW Anthropology';
    document.getElementById('eyebrow').textContent = m.eyebrow;
    document.getElementById('title').textContent = m.processName + ': ' + m.stageLabel;
    document.getElementById('sub').textContent = 'Student: ' + R.studentName + ' · Your role: ' + m.roleLabel + (R.due ? ' · Due ' + R.due : '');
    var h = scopeBox(m);
    if (R.returned) h += '<div class="warnbox"><strong>The GPC asked you to look again at your annual review evaluation:</strong> ' + nl2br(R.returnNote) + '</div>';
    if (R.flags && R.flags.length && R.stage === 'advisor') h += '<div class="note"><strong>Flags</strong><ul>' + R.flags.map(function (f) { return '<li>' + esc(f.text) + '</li>'; }).join('') + '</ul></div>';
    var draft = R.draft || {};
    var injected = [];   // fields filled in on this page rather than loaded from a saved draft; sent on the first save
    if (R.stage === 'student') {
      var pre = R.prefill || {};
      FIELDS = R.type === 'ANNUAL' ? STUDENT_ANNUAL : STUDENT_MA;
      if (R.type === 'ANNUAL') {
        if (!draft.coursework && pre.coursework) { draft.coursework = pre.coursework; injected.push('coursework'); }
        if (!draft.lastGoals && pre.lastGoals) { draft.lastGoals = pre.lastGoals; injected.push('lastGoals'); }
        if (!draft.actionItemsProgress && pre.actionItemsProgress) { draft.actionItemsProgress = pre.actionItemsProgress; injected.push('actionItemsProgress'); }
        var of = R.onFile || {};
        h += '<div class="note"><strong>On file:</strong> ' + esc(of.program || '') + (of.subfield ? ' · ' + esc(of.subfield) : '') +
          (of.entryQuarter ? ' · entered ' + esc(of.entryQuarter) : '') + ' · advisor' + ((of.advisors || []).length === 1 ? '' : 's') + ': ' + esc((of.advisors || []).join(', ') || 'none recorded') +
          ' · committee chair: ' + esc(of.chair || 'none recorded') + (of.gsr ? ' · GSR: ' + esc(of.gsr) : '') + (of.leaveEnds ? ' · on leave until ' + esc(of.leaveEnds) : '') + '</div>';
        var mg = pre.mygrad || {};
        h += '<div class="note"><strong>From MyGrad:</strong> candidacy ' + esc(mg.candidacyDate || 'not yet') + ' · ANTH 800 credits ' + esc(mg.anth800Credits || 0) +
          ' · doctoral committee ' + esc(mg.hasDocComm || '?') + ' · UW degrees ' + esc(mg.uwDegrees || 'none') + '. Correct anything wrong in the first box.</div>';
        if (R.courseFeedback) h += section('Your Course Feedback Record (read-only)', recordHtml(R.courseFeedback));
      }
    }
    if (R.stage === 'advisor') {
      FIELDS = R.type === 'ANNUAL' ? ADVISOR_ANNUAL : ADVISOR_CHECKIN;
      if (R.type === 'ANNUAL' && !draft.agreement) {
        draft.agreement = ['milestones', 'research', 'coursework', 'professional activity', 'next year\'s plan'].map(function (a) { return { area: a, agree: '', comment: '' }; });
        injected.push('agreement');
      }
      var studentFields = R.type === 'ANNUAL' ? STUDENT_ANNUAL : STUDENT_MA;
      var sr = R.studentReport || {};
      h += section(R.studentName + "'s report (read-only)", renderReadOnlyFields(sr, studentFields, ['prefill', 'signatureName'], EXTRA_LABELS) || '<p class="muted">Nothing submitted.</p>');
      if (R.development && Object.keys(R.development).length) h += section('Development modules (you and the student only)', renderReadOnlyFields(R.development, studentFields.concat(FIELDS), [], EXTRA_LABELS));
      if (R.cvUrl) h += section("The student's CV", '<p><a href="' + esc(R.cvUrl) + '" target="_blank" rel="noopener">Open the CV</a> (shared with your UW account)</p>');
      if (R.courseFeedback) h += section('Course Feedback Record (read-only)', recordHtml(R.courseFeedback));
    }
    if (R.stage === 'ack') {
      FIELDS = ACK;
      var advisorFields = R.type === 'ANNUAL' ? ADVISOR_ANNUAL : ADVISOR_CHECKIN;
      h += section("Your advisor's evaluation", renderReadOnlyFields(R.advisor || {}, advisorFields, ['signatureName'], EXTRA_LABELS));
      if (R.advisingChallenges) h += section("Your advisor's note on advising", nl2br(R.advisingChallenges));
      h += section('Final rating', esc(R.finalRating)) + section('Your letter', '<div class="card">' + nl2br(R.letterText) + '</div>');
      h += '<div class="note">You can respond in writing, ask to meet the GPC, use informal resolution with the GPC or the Office of the Ombud, and then the College of Arts &amp; Sciences grievance procedure (Policy 3.8).</div>';
    }
    h += '<h2>' + esc(m.stageLabel) + '</h2><form id="form" onsubmit="return false">' + FIELDS.map(function (f) { return fieldHtml(f, draft[f.key]); }).join('') + '</form>';
    if (R.stage === 'student' && R.type === 'ANNUAL') h += '<h3>CV (recommended)</h3><form id="cvform"><label for="cv">CV with the past year highlighted (PDF, 10 MB or smaller)</label><input type="file" id="cv" name="cv" accept="application/pdf"><button type="button" id="cvup">Upload CV</button></form>';
    h += '<div class="status"><button id="save">Save draft</button><button id="submit" class="primary">' + esc(m.submitLabel) + '</button><div id="msg" role="status" aria-live="polite"></div></div>';
    document.getElementById('main').innerHTML = h;
    bindForm(document.getElementById('form'), FIELDS);
    document.getElementById('save').onclick = function () { send(false); };
    document.getElementById('submit').onclick = function () {
      if (confirm('Submit your ' + m.processName + ' (' + m.stageLabel + ') for ' + R.studentName + '? You will not be able to change it afterwards.')) send(true);
    };
    var up = document.getElementById('cvup');
    if (up) up.onclick = function () {
      say('Uploading…');
      google.script.run.withSuccessHandler(function () { say('CV uploaded.', 'ok'); }).withFailureHandler(function (e) { say(e.message, 'bad'); }).uploadCv(DATA.token, document.getElementById('cvform'));
    };
    setBaseline(injected);
    AUTOSAVE = setInterval(function () { send(false, true); }, 60000);
  }

  /* ---- Saving ---- */
  /* Only the fields changed since the last successful save are sent. Co-advisors editing different
     fields no longer overwrite each other, and an unchanged form is not autosaved at all. */
  var AUTOSAVE = null;
  var BASELINE = {};
  var sending = false;
  var queued = null;   // a Save or Submit pressed while an autosave was running

  function setBaseline(unsentKeys) {
    BASELINE = collectForm(document.getElementById('form'));
    unsentKeys.forEach(function (k) { delete BASELINE[k]; });
  }

  function changedFields(current) {
    var changes = {};
    Object.keys(current).forEach(function (k) {
      if (JSON.stringify(current[k]) !== JSON.stringify(BASELINE[k])) changes[k] = current[k];
    });
    return changes;
  }

  function runQueued() {
    if (!queued) return;
    var next = queued;
    queued = null;
    send(next.final);
  }

  function send(final, quiet) {
    if (sending) {
      if (!quiet) {
        queued = { final: final };
        say(final ? 'Submitting as soon as the autosave finishes…' : 'Saving as soon as the autosave finishes…');
      }
      return;
    }
    var form = document.getElementById('form');
    if (!form) return;
    var changes = changedFields(collectForm(form));
    if (quiet && !Object.keys(changes).length) return;
    sending = true;
    if (!quiet) say(final ? 'Submitting…' : 'Saving…');
    call('saveReviewStage', DATA.token, changes, final).then(function () {
      sending = false;
      Object.keys(changes).forEach(function (k) { BASELINE[k] = changes[k]; });
      if (final) {
        clearInterval(AUTOSAVE);
        var label = (typeof reviewMeta === 'function' && typeof esc === 'function')
          ? '<strong>' + esc(reviewMeta().processName + ' (' + reviewMeta().stageLabel + ')') + '</strong> for <strong>' + esc(R.studentName) + '</strong>'
          : (R.stage === 'ack' ? 'acknowledgement' : 'submission');
        document.getElementById('main').innerHTML = '<div class="card"><h2>Thank you</h2><p>Your ' + label + ' is saved. You will receive an email when there is a next step.</p></div>';
        return;
      }
      if (!quiet) say('Draft saved.', 'ok');
      runQueued();
    }).catch(function (e) {
      sending = false;
      say(quiet ? 'Autosave failed: ' + e.message : e.message, 'bad');
      runQueued();
    });
  }

  call('loadReview', DATA.token).then(function (r) {
    if (r.error) { document.getElementById('main').innerHTML = '<div class="warnbox">' + esc(r.error) + '</div>'; return; }
    R = r; render();
  }).catch(function (e) { document.getElementById('main').innerHTML = '<div class="warnbox">' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
