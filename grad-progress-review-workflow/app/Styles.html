<style>
  :root { --uw: #4b2e83; --gold: #b7a57a; --ink: #222; --muted: #595959; --line: #d0d0d0; --bg: #fafafa; --ok: #1a7f37; --bad: #b71c1c; --warn: #8a5300; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, Helvetica, sans-serif; color: var(--ink); background: #fff; }
  header.top { background: var(--uw); color: #fff; padding: 14px 20px; }
  header.top h1 { margin: 0; font-size: 20px; }
  header.top p { margin: 4px 0 0; color: #e8e3d3; font-size: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 16px 20px 80px; }
  h2 { font-size: 19px; color: var(--uw); margin: 28px 0 8px; border-bottom: 2px solid var(--gold); padding-bottom: 4px; }
  h3 { font-size: 16px; margin: 18px 0 6px; }
  .note { background: #f3eefc; border-left: 4px solid var(--uw); padding: 10px 14px; margin: 12px 0; }
  .warnbox { background: #fff6e5; border-left: 4px solid var(--warn); padding: 10px 14px; margin: 12px 0; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin: 14px 0; background: #fff; }
  .muted { color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: bold; margin: 12px 0 4px; }
  .help { font-weight: normal; color: var(--muted); font-size: 14px; display: block; }
  input[type=text], input[type=email], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 8px; font: inherit; border: 1px solid #8a8a8a; border-radius: 4px; background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  fieldset { border: 1px solid var(--line); border-radius: 6px; margin: 10px 0; padding: 8px 12px; }
  legend { font-weight: bold; padding: 0 4px; }
  .radio { display: block; font-weight: normal; margin: 4px 0; }
  button { font: inherit; padding: 9px 16px; border-radius: 4px; border: 1px solid var(--uw); background: #fff; color: var(--uw); cursor: pointer; margin: 6px 8px 6px 0; }
  button.primary { background: var(--uw); color: #fff; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  table.rows { width: 100%; border-collapse: collapse; margin: 6px 0; }
  table.rows th, table.rows td { border: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; font-size: 14px; }
  table.rows input, table.rows select, table.rows textarea { padding: 5px; }
  .status { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 0; }
  #msg { min-height: 1.5em; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .counter { font-size: 13px; color: var(--muted); text-align: right; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #eee; font-size: 13px; margin-right: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } main { padding: 12px 14px 80px; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
